<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in Panelka</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%232e1d14'/%3E%3Crect x='2' y='3' width='12' height='13' fill='%23585450'/%3E%3Crect x='3' y='5' width='2' height='2' fill='%23ffb860'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23201a16'/%3E%3Crect x='11' y='5' width='2' height='2' fill='%23ffb860'/%3E%3Crect x='3' y='9' width='2' height='2' fill='%23201a16'/%3E%3Crect x='7' y='9' width='2' height='2' fill='%23ffb860'/%3E%3Crect x='11' y='9' width='2' height='2' fill='%23201a16'/%3E%3Crect x='7' y='13' width='2' height='3' fill='%23ffd890'/%3E%3Crect x='0' y='15' width='16' height='1' fill='%23e0e2e8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <div id="fps" class="hidden"></div>
    <div id="hint" class="hidden"></div>

    <!-- Splash -->
    <div id="splash" class="screen">
      <div class="splash-logo">LOST IN PANELKA</div>
      <div class="blink hidden" id="splash-press">PRESS ANY KEY</div>
      <div class="hint" id="splash-load">building the microdistrict</div>
      <div class="hint">best with headphones, in the dark</div>
    </div>

    <!-- Title: pick the snowfall and go -->
    <div id="title" class="screen hidden">
      <div class="title-wrap">
        <h1 class="logo">LOST IN PANELKA</h1>
        <div class="subtitle">a winter night in the yards</div>
        <div class="maps" id="maps"></div>
        <nav class="menu menu-row" id="title-menu">
          <button data-act="controls">Controls</button>
          <button data-act="settings">Settings</button>
          <button data-act="about">About</button>
        </nav>
      </div>
      <div class="now-playing" id="now-playing"></div>
    </div>

    <!-- Pause -->
    <div id="pause" class="screen hidden">
      <div class="title-box">
        <div class="pause-head">PAUSED</div>
        <div class="pause-map" id="pause-map"></div>
        <nav class="menu" id="pause-menu">
          <button data-act="resume">Resume</button>
          <button data-act="title">Main menu</button>
          <button data-act="controls">Controls</button>
          <button data-act="settings">Settings</button>
          <button data-act="about">About</button>
        </nav>
      </div>
      <div class="now-playing" id="now-playing-pause"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden">
      <div class="panel">
        <div class="panel-head"><span id="modal-title"></span><button id="modal-close">X</button></div>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="fade"></div>
    <div id="crt"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
